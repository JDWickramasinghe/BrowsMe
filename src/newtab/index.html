<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action https://www.google.com"
    >
    <title>New tab</title>
    <link rel="stylesheet" href="newtab.css">
    <script src="newtab.js" defer></script>
    <script src="search-glass.js" defer></script>
  </head>
  <body>
    <main class="clock-screen">
      <h1 class="date-line">
        <span id="weekday">New tab</span>
        <time id="today"></time>
      </h1>
      <div class="home-dock">
        <form class="search-glass" action="https://www.google.com/search" method="get" role="search">
          <input name="q" type="search" required autocomplete="off" placeholder="Search the web" aria-label="Search Google">
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m14.5 14.5 4.5 4.5"></path></svg>
          </button>
        </form>
        <time id="local-time" class="clock" aria-label="Local time"></time>
      </div>
    </main>
    <svg width="0" height="0" class="search-optics" aria-hidden="true">
      <defs>
        <filter id="search-lens" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage id="search-lens-profile" preserveAspectRatio="none" result="lens"></feImage>
          <feDisplacementMap in="SourceGraphic" in2="lens" scale="22" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
      </defs>
    </svg>
  </body>
</html>
